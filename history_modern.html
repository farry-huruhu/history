<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>近代史コース選択</title>
    <link rel="stylesheet" href="history_modern.css">
</head>
<body>

    <div class="fountain-pen" onclick="togglePen()">
        <div class="pen-cap"></div>
        <div class="pen-nib"></div>
        <div class="pen-body"></div>
    </div>

    <div class="coffee-cup"></div>

    <div class="book-scene">
        <div class="book">
            
            <div class="book-cover">
                
                <div class="cover-front">
                    <div class="cover-content">
                        <h2>近代史<br><span style="font-size:0.6em">激動の時代</span></h2>
                        <div class="deco-line"></div>
                        <p class="tap-hint">Tap / Hover to Open</p>
                    </div>
                </div>

                <div class="cover-back">
                    <div class="back-deco">History Note</div>
                </div>

            </div>

            <div class="book-inside">
                <h3>学習メニュー</h3>
                
                <a href="history_modern.html" class="chapter-link">
                    <span class="chapter-title">1. 明治維新と文明開化</span>
                    <span class="arrow">▶</span>
                </a>

                <a href="history_modern_chapter3.html" class="chapter-link">
                    <span class="chapter-title">2. 日清・日露戦争</span>
                    <span class="arrow">▶</span>
                </a>

                <a href="#" class="chapter-link" style="opacity: 0.5; cursor: default;">
                    <span class="chapter-title">3. （準備中）</span>
                    <span class="arrow">🔒</span>
                </a>
            </div>

        </div>
    </div>

    <a href="index.html" class="back-home">← トップページに戻る</a>

    <div id="achievement-box" class="achievement">
        <div class="icon">🏆</div>
        <div class="text">
            <span class="title">実績解除</span>
            <span class="desc">学びへの第一歩</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 設定（achievements.js と同じキー名にする）
        // ==========================================
        const SAVE_KEY = 'history_achievements';     // 保存場所の名前
        const PEN_ACHIEVEMENT_ID = 'achv_learning_prep'; // ペンの実績ID

        let isAchievementUnlocked = false;
        
        // ページを開いた瞬間のチェック
        document.addEventListener('DOMContentLoaded', () => {
            const savedData = localStorage.getItem(SAVE_KEY);
            const myAchievements = savedData ? JSON.parse(savedData) : [];
            
            // すでに実績を持っているなら、フラグを立てておく（通知は出さない）
            if (myAchievements.includes(PEN_ACHIEVEMENT_ID)) {
                isAchievementUnlocked = true;
                // すでに獲得済みなら、最初からペンを開けておく演出も可能です
                // document.querySelector('.fountain-pen').classList.add('open');
            }
        });

        // ペンをクリックした時の動作
        function togglePen() {
            const pen = document.querySelector('.fountain-pen');
            
            // ペンの開け閉め（クラスの付け外し）
            pen.classList.toggle('open');

            // 「ペンが開いた」かつ「まだ実績解除していない」場合
            if (pen.classList.contains('open') && !isAchievementUnlocked) {
                unlockPenAchievement();
                isAchievementUnlocked = true;
            }
        }

        // 実績解除の処理（保存＆通知）
        function unlockPenAchievement() {
            // 1. 画面に通知を出す
            showAchievement();

            // 2. データを保存する
            const savedData = localStorage.getItem(SAVE_KEY);
            const myAchievements = savedData ? JSON.parse(savedData) : [];

            // まだリストに入っていなければ追加して保存
            if (!myAchievements.includes(PEN_ACHIEVEMENT_ID)) {
                myAchievements.push(PEN_ACHIEVEMENT_ID);
                localStorage.setItem(SAVE_KEY, JSON.stringify(myAchievements));
            }
        }

        // 通知ボックスを表示するアニメーション
        function showAchievement() {
            const box = document.getElementById('achievement-box');
            if(box) {
                box.classList.add('show');
                // 4秒後に消す
                setTimeout(() => {
                    box.classList.remove('show');
                }, 4000);
            }
        }
    </script>

</body>
</html>
