<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>総合問題 (復習問題)</title>
    <link rel="stylesheet" href="history_comprehensive_review.css">
</head>
<body>

    <header>
        <h1>【世界史/日本史】総合問題 (復習問題)</h1>
    </header>

    <main>
        <nav class="breadcrumb-nav">
            <a href="history_modern.html">🏠 近代ホームへ戻る</a>
            <span>/</span>
            <a href="history_comprehensive_menu.html">⏪ 総合問題メニューへ戻る</a>
        </nav>

        <section class="content-block">
            <h2>✍️ 復習問題</h2>
            <p>間違えた問題に再挑戦してください。正解した問題は復習リストから削除されます。</p>
            
            <div class="quiz-actions">
                <button id="check-answers-btn" class="action-btn positive">答え合わせ</button>
                <button id="reload-quiz-btn" class="action-btn">ページを更新 (リロード)</button>
                <button id="reset-inputs-btn" class="action-btn negative">入力リセット</button>
            </div>

            <div id="results-area">
                </div>

            <div id="quiz-container">
                </div>

            <div class="quiz-actions-secondary">
                <button id="show-answers-btn" class="action-btn" disabled>（すべての）答えを表示する</button>
                <button id="show-partial-btn" class="action-btn" disabled>一部の答えを表示する</button>
            </div>
            </section>
    </main>

    <a href="history_comprehensive_menu.html" id="back-to-menu-float-btn">⏪<br>メニューへ</a>

    <div id="modal-backdrop"></div>
    <div id="modal-content">
        <h3>答えを表示する問題番号を選択</h3>
        <div id="modal-checkboxes-container"></div>
        <div class="modal-buttons">
            <button id="modal-confirm-btn" class="positive">選択した答えを表示</button>
            <button id="modal-cancel-btn" class="negative">キャンセル</button>
        </div>
    </div>

    <script src="history_comprehensive_review.js"></script>
</body>
</html>
