<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漢字一文字クイズ ホーム</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background: linear-gradient(to bottom, #e0f7fa, #f0f4f8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        #home-container {
            background-color: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            min-width: 300px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
        }
        /* ボタン共通スタイル */
        .start-button {
            display: block;
            width: 100%;
            box-sizing: border-box; /* パディングを含めて幅を計算 */
            font-size: 20px;
            padding: 15px 30px;
            cursor: pointer;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s;
            margin-bottom: 15px; /* ボタン間の余白 */
        }
        .start-button:hover {
            opacity: 0.9;
        }
        
        /* 練習モード (青) */
        .button-practice {
            background-color: #007bff;
        }
        .button-practice:hover {
            background-color: #0056b3;
        }

        /* チャレンジモード (オレンジ) */
        .button-challenge {
            background-color: #fd7e14;
        }
        .button-challenge:hover {
            background-color: #c96511;
        }
        
        .back-link {
            display: block;
            margin-top: 20px;
            font-size: 16px;
            color: #555;
        }
        
        .button-reverse {
    background-color: #28a745; /* 緑色 (ご提示の青 #007bff から変更) */
    border-color: #28a745;     /* 枠線の色も緑に */
    
    /* ↓ 中の文字色を白に変更 (start-buttonの上書き) */
    color: white;
}

/* ↓ h3, pタグの文字色も白に */
.button-reverse h3,
.button-reverse p {
    color: white;
}

.button-reverse:hover {
    background-color: #218838; /* ホバー時 (濃い緑) */
    border-color: #218838;
    color: white;
}

.button-mix {
    background-color: #6f42c1; /* 紫色 */
    border-color: #6f42c1;
    color: white;
}
.button-mix h3,
.button-mix p {
    color: white;
}
.button-mix:hover {
    background-color: #5a379e; /* 濃い紫 */
    border-color: #5a379e;
    color: white;
}

/* ★★★ ミックスボタンをデフォルトで非表示にする ★★★ */
#mix-game-section {
    display: none;
}
#main-home-float-btn {
    position: fixed; /* 画面に固定 */
    bottom: 20px;    /* 下から20px */
    right: 20px;     /* 右から20px */
    
    display: block;
    width: 70px;
    height: 70px;
    background-color: #007bff; /* 青色 */
    color: white;
    text-align: center;
    text-decoration: none;
    border-radius: 50%; /* 丸くする */
    
    font-size: 14px;
    font-weight: bold;
    line-height: 1.3;
    padding-top: 15px; /* 文字を中央に寄せる (2行用) */
    box-sizing: border-box;
    
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: background-color 0.2s, transform 0.2s;
    
    z-index: 1000; /* 他の要素より手前に表示 */
}

/* マウスを乗せた時 */
#main-home-float-btn:hover {
    background-color: #0056b3; /* 少し濃い青 */
    transform: scale(1.1); /* 少し大きくする */
}
    </style>
</head>
<body>
<a href="quiz_index.html" id="main-home-float-btn">🏠<br>メインへ</a>
    <div id="home-container">
        <h1>漢字一文字クイズ</h1>
        <p>（漢字→国名）</p>
        
        <a href="quiz_kanji.html" class="start-button button-practice">
            練習モード (時間無制限)
        </a>

        <a href="quiz_challenge.html" class="start-button button-challenge">
            チャレンジモード (60秒)
        </a>

        <a href="quiz_reverse_kanji.html" class="start-button button-reverse">
            逆・国一文字ゲーム
        </a>
        <section classs="theme-section" id="mix-game-section">
            <div class="theme-container" style="grid-template-columns: 1fr;">
                <a href="quiz_mix_kanji.html" class="start-button button-mix">
                    ミックス・国一文字ゲーム
                    
                </a>
            </div>
        </section>
<script src="home_kanji.js"></script>
</body>
</html>
